<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🚆 Dynamic Train Forecast System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* --- All existing CSS (unchanged) --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background: #080c18;
            background-image: radial-gradient(ellipse at 30% 10%, rgba(230, 57, 70, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 90%, rgba(0, 230, 118, 0.04) 0%, transparent 50%);
            padding: 24px;
            color: #ffffff;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 80px,
                    rgba(255, 255, 255, 0.01) 80px,
                    rgba(255, 255, 255, 0.01) 81px),
                repeating-linear-gradient(90deg,
                    transparent,
                    transparent 80px,
                    rgba(255, 255, 255, 0.01) 80px,
                    rgba(255, 255, 255, 0.01) 81px);
            pointer-events: none;
            z-index: 0;
        }
        .container { max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }

        .glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        .gradient-text {
            background: linear-gradient(135deg, #ffffff 30%, #7e94b9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hidden-passenger { display: none; }
        .admin-mode .hidden-passenger { display: block; }
        .hidden-admin { display: block; }
        .admin-mode .hidden-admin { display: none; }

        /* --- Header --- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 32px;
            margin-bottom: 32px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
            animation: slideDown 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes slideDown {
            0% { opacity: 0; transform: translateY(-30px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .header-left { display: flex; align-items: center; gap: 18px; }
        .header-icon {
            background: linear-gradient(135deg, #e63946, #ff4d5a);
            width: 56px;
            height: 56px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 12px 32px rgba(230, 57, 70, 0.3);
            animation: pulseGlow 3s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 12px 32px rgba(230, 57, 70, 0.3); }
            50% { box-shadow: 0 12px 48px rgba(230, 57, 70, 0.5); }
        }
        .header h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
        .header h1 span { font-weight: 400; font-size: 15px; color: #7e94b9; -webkit-text-fill-color: #7e94b9; background: none; margin-left: 10px; }
        .header-right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .badge {
            background: rgba(0, 230, 118, 0.1);
            color: #00e676;
            padding: 8px 20px;
            border-radius: 60px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(0, 230, 118, 0.15);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: pulseBadge 2.5s ease-in-out infinite;
        }
        @keyframes pulseBadge {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.75; }
        }
        .badge .dot { width: 10px; height: 10px; background: #00e676; border-radius: 50%; display: inline-block; animation: dotPulse 1.5s ease-in-out infinite; }
        @keyframes dotPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.6); opacity: 0.5; }
        }
        .mode-toggle {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: #a0b4d6;
            padding: 8px 16px;
            border-radius: 60px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mode-toggle:hover { background: rgba(255,255,255,0.1); color: white; }
        .mode-toggle.active { background: rgba(230, 57, 70, 0.15); border-color: #e63946; color: white; }

        /* --- Hero --- */
        .hero {
            margin-bottom: 32px;
            padding: 40px 44px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-radius: 48px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.3);
            animation: fadeUp 0.6s ease 0.1s both;
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .hero-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 24px;
        }
        .hero-greeting h2 { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
        .hero-greeting p { color: #7e94b9; font-size: 16px; margin-top: 6px; }
        .hero-stats { display: flex; gap: 24px; flex-wrap: wrap; }
        .stat-item {
            text-align: center;
            background: rgba(255, 255, 255, 0.02);
            padding: 12px 24px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            min-width: 100px;
        }
        .stat-item .number { font-size: 28px; font-weight: 700; display: block; }
        .stat-item .label { font-size: 12px; color: #7e94b9; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-item .number.green { color: #00e676; }
        .stat-item .number.red { color: #ff6b6b; }
        .stat-item .number.orange { color: #ffc107; }

        /* --- Tabs --- */
        .search-tabs {
            display: flex;
            gap: 16px;
            margin-bottom: 28px;
            animation: fadeUp 0.6s ease 0.2s both;
        }
        .tab-btn {
            padding: 14px 32px;
            border-radius: 60px;
            border: none;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            color: #a0b4d6;
            font-weight: 600;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .tab-btn:hover { background: rgba(255, 255, 255, 0.06); color: white; transform: translateY(-2px); }
        .tab-btn.active { background: rgba(230, 57, 70, 0.15); border-color: #e63946; color: white; box-shadow: 0 8px 24px rgba(230, 57, 70, 0.15); }
        .tab-btn i { font-size: 18px; }

        /* --- Search Cards --- */
        .search-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 36px;
            padding: 32px 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 28px;
            display: none;
            animation: cardSlide 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2);
        }
        .search-card.active { display: block; }
        @keyframes cardSlide {
            0% { opacity: 0; transform: scale(0.97) translateY(12px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .search-title { color: #7e94b9; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 22px; display: flex; align-items: center; gap: 12px; }
        .search-title i { color: #e63946; font-size: 18px; }
        .search-row { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-end; }
        .search-group { flex: 1; min-width: 170px; }
        .search-group label { display: block; color: #7e94b9; font-size: 12px; font-weight: 600; margin-bottom: 8px; letter-spacing: 0.4px; }
        .search-group input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(0, 0, 0, 0.35);
            color: #ffffff;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            outline: none;
            backdrop-filter: blur(4px);
        }
        .search-group input:focus { border-color: #e63946; background: rgba(0, 0, 0, 0.5); box-shadow: 0 0 0 4px rgba(230, 57, 70, 0.08); }
        .search-group input::placeholder { color: #4f6586; }
        .btn-search {
            background: linear-gradient(135deg, #e63946, #ff4d5a);
            color: white;
            border: none;
            padding: 16px 48px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 12px 32px rgba(230, 57, 70, 0.25);
            display: flex;
            align-items: center;
            gap: 14px;
            min-height: 58px;
            position: relative;
            overflow: hidden;
        }
        .btn-search::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.15), transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }
        .btn-search:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 16px 48px rgba(230, 57, 70, 0.35); }
        .btn-search:hover::after { opacity: 1; }
        .btn-search:active { transform: scale(0.97); }
        .btn-back {
            background: rgba(255, 255, 255, 0.04);
            color: #a0b4d6;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(4px);
        }
        .btn-back:hover { background: rgba(255, 255, 255, 0.08); color: white; transform: translateX(-6px); }
        .quick-routes {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .quick-routes span { color: #4f6586; font-size: 13px; font-weight: 500; }
        .quick-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #b4c8ea;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
        }
        .quick-btn:hover { background: rgba(230, 57, 70, 0.15); border-color: #e63946; color: white; transform: translateY(-3px) scale(1.03); }

        /* --- Live Feed --- */
        .live-feed { margin-top: 32px; animation: fadeUp 0.6s ease 0.3s both; }
        .live-feed h3 { font-size: 18px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; color: #a0b4d6; }
        .live-feed h3 i { color: #e63946; animation: pulseGlow 2s infinite; }
        .live-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }
        .live-card {
            background: rgba(255, 255, 255, 0.02);
            padding: 18px 20px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .live-card:hover { background: rgba(255, 255, 255, 0.04); transform: translateY(-4px); border-color: rgba(230, 57, 70, 0.15); }
        .live-card .train-num { font-weight: 700; font-size: 16px; }
        .live-card .train-name { color: #a0b4d6; font-size: 14px; margin: 4px 0 8px; }
        .live-card .status { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .live-card .status .delay-badge { padding: 2px 12px; border-radius: 60px; font-weight: 600; }
        .live-card .status .delay-badge.on-time { background: rgba(0, 230, 118, 0.1); color: #00e676; }
        .live-card .status .delay-badge.delayed { background: rgba(255, 107, 107, 0.1); color: #ff6b6b; }
        .live-card .route-mini { color: #4f6586; font-size: 12px; margin-top: 6px; display: flex; align-items: center; gap: 4px; }

        /* --- Spinner --- */
        .spinner { display: none; text-align: center; padding: 60px 0; }
        .spinner.active { display: block; animation: fadeUp 0.4s ease; }
        .spinner i { font-size: 48px; color: #e63946; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .spinner p { color: #7e94b9; margin-top: 16px; font-weight: 500; letter-spacing: 0.5px; font-size: 16px; }

        /* --- Results --- */
        .results-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 36px;
            padding: 32px 36px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: none;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2);
        }
        .results-card.visible { display: block; animation: resultSlide 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        @keyframes resultSlide {
            0% { opacity: 0; transform: translateY(30px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .results-header h2 { font-size: 24px; font-weight: 700; }
        .results-header h2 small { font-weight: 400; font-size: 16px; color: #7e94b9; margin-left: 10px; }
        .results-count { color: #a0b4d6; font-size: 14px; background: rgba(255, 255, 255, 0.03); padding: 6px 20px; border-radius: 60px; border: 1px solid rgba(255, 255, 255, 0.04); }
        .train-list { display: flex; flex-direction: column; gap: 16px; }
        .train-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 28px;
            padding: 20px 28px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            flex-wrap: wrap;
            gap: 14px;
            backdrop-filter: blur(4px);
            position: relative;
            overflow: hidden;
        }
        .train-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(230, 57, 70, 0.05), transparent 60%);
            opacity: 0;
            transition: opacity 0.4s;
        }
        .train-item:hover { background: rgba(255, 255, 255, 0.04); border-color: rgba(230, 57, 70, 0.15); transform: translateX(8px) scale(1.01); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); }
        .train-item:hover::before { opacity: 1; }
        .train-item-left { display: flex; flex-direction: column; gap: 6px; position: relative; z-index: 1; }
        .train-item-left .number { font-weight: 700; font-size: 18px; color: white; }
        .train-item-left .number small { font-weight: 400; font-size: 15px; color: #a0b4d6; margin-left: 10px; }
        .train-item-left .route-info { color: #7e94b9; font-size: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
        .train-item-left .route-info i { margin: 0 6px; font-size: 11px; color: #4f6586; }
        .train-item-right { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; position: relative; z-index: 1; }
        .train-item-right .delay { font-weight: 600; font-size: 14px; padding: 4px 18px; border-radius: 60px; }
        .train-item-right .delay.delayed { background: rgba(255, 107, 107, 0.12); color: #ff6b6b; }
        .train-item-right .delay.on-time { background: rgba(0, 230, 118, 0.12); color: #00e676; }
        .train-item-right .eta-badge { color: #b4c8ea; font-size: 14px; background: rgba(255, 255, 255, 0.03); padding: 4px 16px; border-radius: 60px; }
        .train-item-right .click-hint { color: #4f6586; font-size: 16px; transition: transform 0.3s ease; }
        .train-item:hover .click-hint { transform: translateX(6px); color: #a0b4d6; }
        .no-trains { color: #7e94b9; text-align: center; padding: 60px 0; font-size: 18px; }
        .no-trains i { font-size: 56px; display: block; margin-bottom: 20px; color: #4f6586; }

        /* --- Detail View --- */
        #detailView { display: none; animation: detailSlide 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        #detailView.visible { display: block; }
        @keyframes detailSlide {
            0% { opacity: 0; transform: translateY(40px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .detail-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 36px;
            padding: 36px 42px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 28px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2);
        }
        .detail-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 18px; margin-bottom: 28px; }
        .detail-train-info h2 { font-size: 30px; font-weight: 700; }
        .detail-train-info h2 small { font-weight: 400; font-size: 22px; color: #7e94b9; margin-left: 12px; }
        .detail-train-info .train-type { color: #a0b4d6; font-size: 16px; margin-top: 6px; display: block; }
        .detail-status { font-weight: 600; font-size: 16px; padding: 8px 26px; border-radius: 60px; border: 1px solid transparent; }
        .detail-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 18px;
            margin: 28px 0;
        }
        .detail-metric {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 24px;
            padding: 18px 22px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: transform 0.3s ease, background 0.3s;
        }
        .detail-metric:hover { transform: translateY(-6px); background: rgba(255, 255, 255, 0.03); }
        .detail-metric .label { color: #5a6f92; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; display: flex; align-items: center; gap: 8px; }
        .detail-metric .value { color: white; font-size: 24px; font-weight: 700; margin-top: 8px; }
        .detail-metric .value .unit { font-size: 15px; font-weight: 400; color: #7e94b9; margin-left: 4px; }

        /* --- Comparison Card --- */
        .comparison-card {
            background: rgba(255, 193, 7, 0.04);
            border: 1px solid rgba(255, 193, 7, 0.08);
            border-radius: 24px;
            padding: 20px 24px;
            margin: 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .comparison-card .label { color: #a0b4d6; font-size: 14px; font-weight: 500; }
        .comparison-card .value { font-weight: 700; font-size: 20px; }
        .comparison-card .savings { color: #00e676; }

        /* --- Override --- */
        .override-section {
            margin: 20px 0;
            padding: 20px 24px;
            background: rgba(255, 107, 107, 0.04);
            border-radius: 24px;
            border-left: 4px solid #ff6b6b;
        }
        .override-section h4 { color: #a0b4d6; font-size: 14px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
        .override-section .btn-group { display: flex; gap: 12px; flex-wrap: wrap; }
        .override-btn {
            padding: 8px 20px;
            border-radius: 60px;
            border: 1px solid rgba(255, 107, 107, 0.2);
            background: rgba(255, 107, 107, 0.05);
            color: #ff6b6b;
            font-weight: 600;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .override-btn:hover { background: rgba(255, 107, 107, 0.15); transform: scale(1.05); }
        .override-btn.clear { border-color: rgba(0, 230, 118, 0.2); color: #00e676; background: rgba(0, 230, 118, 0.05); }
        .override-btn.clear:hover { background: rgba(0, 230, 118, 0.15); }

        /* --- Route Map --- */
        .route-map-container {
            margin: 20px 0 24px 0;
            height: 280px;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            background: #0a0e1a;
        }
        .route-map-container .leaflet-container {
            height: 100%;
            width: 100%;
        }

        /* --- Route Stations (preserved) --- */
        .route-map-old {
            margin: 16px 0 20px 0;
            padding: 16px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .route-map-old h4 {
            color: #a0b4d6;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .route-stations-detailed {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }
        .station-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 18px;
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            min-width: 80px;
            transition: all 0.4s ease;
            position: relative;
        }
        .station-node:hover { transform: scale(1.08); background: rgba(255, 255, 255, 0.04); }
        .station-node.current {
            border-color: #e63946;
            background: rgba(230, 57, 70, 0.08);
            box-shadow: 0 0 40px rgba(230, 57, 70, 0.05);
        }
        .station-node .code { font-weight: 700; font-size: 15px; color: white; }
        .station-node .name { font-size: 11px; color: #7e94b9; text-align: center; max-width: 90px; line-height: 1.2; }
        .station-node .weather-icon { font-size: 18px; margin-top: 4px; }
        .station-node .scheduled { font-size: 10px; color: #4f6586; margin-top: 2px; }
        .station-node .predicted { font-size: 10px; color: #ffc107; margin-top: 2px; font-weight: 500; }
        .route-arrow {
            color: #4f6586;
            font-size: 16px;
            padding: 0 6px;
            animation: arrowPulse 2s ease-in-out infinite;
        }
        @keyframes arrowPulse {
            0%, 100% { opacity: 0.3; transform: translateX(0); }
            50% { opacity: 1; transform: translateX(6px); }
        }

        /* --- Station ETAs Table --- */
        .station-etas {
            margin: 24px 0;
            overflow-x: auto;
            border-radius: 24px;
            background: rgba(0, 0, 0, 0.2);
            padding: 6px;
        }
        .station-etas h4 { color: #a0b4d6; font-size: 14px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; padding: 0 6px; }
        .station-etas table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 700px; }
        .station-etas th { text-align: left; color: #5a6f92; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; padding: 12px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.04); }
        .station-etas td { padding: 14px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.02); color: #e0e8f5; transition: background 0.2s; vertical-align: middle; }
        .station-etas tr:hover td { background: rgba(255, 255, 255, 0.02); }
        .station-etas td.delayed { color: #ff6b6b; }
        .station-etas td.on-time { color: #00e676; }
        .delay-badge-small {
            background: rgba(255, 107, 107, 0.08);
            color: #ff6b6b;
            padding: 4px 14px;
            border-radius: 60px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
        .delay-badge-small.on-time { background: rgba(0, 230, 118, 0.08); color: #00e676; }
        .history-pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .history-pill {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .history-pill .day { font-weight: 600; }
        .history-pill .time { font-weight: 400; }
        .history-avg { font-size: 12px; font-weight: 600; margin-top: 4px; display: block; }

        /* Weather & Delay Causes */
        .weather-alerts {
            margin: 20px 0;
            padding: 18px 24px;
            background: rgba(255, 193, 7, 0.03);
            border-radius: 24px;
            border-left: 4px solid #ffc107;
        }
        .weather-alerts h4 { color: #a0b4d6; font-size: 14px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
        .weather-alerts h4 i { color: #ffc107; }
        .weather-alert-item { display: flex; align-items: center; gap: 14px; color: #e0e8f5; font-size: 15px; padding: 6px 0; }
        .weather-alert-item .delay-badge { background: rgba(255, 107, 107, 0.08); color: #ff6b6b; padding: 2px 16px; border-radius: 60px; font-size: 13px; font-weight: 600; }
        .delay-causes {
            margin: 20px 0;
            padding: 18px 24px;
            background: rgba(255, 107, 107, 0.03);
            border-radius: 24px;
            border-left: 4px solid #ff6b6b;
        }
        .delay-causes h4 { color: #a0b4d6; font-size: 14px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
        .delay-causes h4 i { color: #ff6b6b; }
        .delay-causes ul { list-style: none; padding: 0; }
        .delay-causes ul li { color: #e0e8f5; font-size: 15px; padding: 4px 0; display: flex; align-items: center; gap: 10px; }
        .delay-causes ul li::before { content: "•"; color: #ff6b6b; font-weight: 700; font-size: 20px; }
        .confidence-bar { margin-top: 28px; }
        .confidence-bar .header { display: flex; justify-content: space-between; color: #a0b4d6; font-size: 14px; font-weight: 600; margin-bottom: 10px; padding: 0; background: none; border: none; }
        .confidence-bar .track { width: 100%; height: 8px; background: rgba(255, 255, 255, 0.04); border-radius: 60px; overflow: hidden; }
        .confidence-bar .fill { height: 100%; background: linear-gradient(90deg, #00e676, #ffc107); border-radius: 60px; transition: width 1.4s cubic-bezier(0.22, 1, 0.36, 1); width: 0%; }

        .error-msg { color: #ff6b6b; background: rgba(255, 107, 107, 0.04); padding: 24px 28px; border-radius: 24px; border: 1px solid rgba(255, 107, 107, 0.08); text-align: center; font-weight: 500; margin-top: 24px; backdrop-filter: blur(4px); font-size: 16px; }
        #errorDisplay { display: none; }

        .action-buttons { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
        .action-btn {
            padding: 10px 22px;
            border-radius: 60px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.03);
            color: #a0b4d6;
            font-weight: 600;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .action-btn:hover { background: rgba(255,255,255,0.08); color: white; transform: translateY(-2px); }

        /* Auto-Refresh Toggle */
        .refresh-toggle {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: #a0b4d6;
            padding: 6px 16px;
            border-radius: 60px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .refresh-toggle:hover { background: rgba(255,255,255,0.1); color: white; }
        .refresh-toggle.active { background: rgba(0, 230, 118, 0.12); border-color: #00e676; color: #00e676; }
        .refresh-toggle .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            background: #4f6586;
        }
        .refresh-toggle.active .pulse-dot {
            background: #00e676;
            animation: dotPulse 1.2s ease-in-out infinite;
        }

        /* PDF Export Button */
        .pdf-btn {
            background: rgba(230, 57, 70, 0.1);
            border: 1px solid rgba(230, 57, 70, 0.15);
            color: #e63946;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .pdf-btn:hover { background: rgba(230, 57, 70, 0.2); transform: scale(1.02); }

        /* Responsive */
        @media (max-width: 992px) {
            .header h1 { font-size: 22px; }
            .header h1 span { font-size: 13px; }
            .detail-card { padding: 28px 24px; }
            .search-card { padding: 24px 28px; }
            .hero { padding: 28px 24px; }
            .hero-greeting h2 { font-size: 26px; }
            .comparison-card { flex-direction: column; align-items: flex-start; }
        }
        @media (max-width: 768px) {
            body { padding: 16px; }
            .header { flex-direction: column; align-items: stretch; text-align: center; padding: 18px 20px; }
            .header-left { justify-content: center; }
            .header-right { justify-content: center; }
            .hero-top { flex-direction: column; align-items: stretch; }
            .hero-stats { justify-content: space-around; }
            .stat-item { flex: 1; min-width: 80px; padding: 10px 12px; }
            .stat-item .number { font-size: 22px; }
            .search-row { flex-direction: column; }
            .btn-search { justify-content: center; width: 100%; }
            .train-item { flex-direction: column; align-items: stretch; }
            .train-item-right { justify-content: space-between; }
            .detail-header { flex-direction: column; }
            .route-stations-detailed { flex-wrap: wrap; justify-content: center; }
            .station-node { min-width: 60px; padding: 8px 12px; }
            .search-tabs { flex-wrap: wrap; }
            .tab-btn { flex: 1; text-align: center; justify-content: center; }
            .station-etas table { font-size: 12px; min-width: 600px; }
            .station-etas td, .station-etas th { padding: 6px 8px; }
            .detail-card { padding: 20px; }
            .station-etas td:last-child { min-width: 140px; }
            .station-etas td:first-child { min-width: 45px; }
            .live-grid { grid-template-columns: 1fr 1fr; }
            .override-section .btn-group { flex-wrap: wrap; }
            .route-map-container { height: 200px; }
        }
        @media (max-width: 480px) {
            .container { padding: 0; }
            .search-card { padding: 18px; }
            .results-card { padding: 16px; }
            .header h1 { font-size: 18px; }
            .detail-train-info h2 { font-size: 22px; }
            .detail-train-info h2 small { font-size: 16px; }
            .station-etas table { min-width: 480px; font-size: 10px; }
            .station-etas td, .station-etas th { padding: 4px 4px; }
            .hero { padding: 20px 16px; }
            .hero-greeting h2 { font-size: 22px; }
            .live-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- HEADER -->
    <header class="header">
        <div class="header-left">
            <div class="header-icon"><i class="fas fa-train"></i></div>
            <h1 class="gradient-text">Dynamic Train Forecast <span>| ETA &amp; Route Analysis</span></h1>
        </div>
        <div class="header-right">
            <div class="badge"><span class="dot"></span> LIVE</div>
            <button class="mode-toggle active" id="modeToggle" onclick="toggleMode()">
                <i class="fas fa-user-shield"></i> Admin Mode
            </button>
        </div>
    </header>

    <!-- HERO -->
    <section class="hero" id="homeHero">
        <div class="hero-top">
            <div class="hero-greeting">
                <h2 class="gradient-text">Welcome back, Rail Controller</h2>
                <p><i class="far fa-calendar-alt" style="margin-right:8px;color:#e63946;"></i><span id="currentDateTime"></span></p>
            </div>
            <div class="hero-stats" id="statsContainer"></div>
        </div>
    </section>

    <!-- TABS -->
    <div class="search-tabs">
        <button class="tab-btn active" onclick="switchTab('route')" id="tabRoute"><i class="fas fa-route"></i> Search by Route</button>
        <button class="tab-btn" onclick="switchTab('train')" id="tabTrain"><i class="fas fa-search"></i> Search by Train Number</button>
    </div>

    <!-- SEARCH CARDS -->
    <div class="search-card active" id="routeSearch">
        <span class="search-title"><i class="fas fa-search"></i> Find Trains by Route (City or Station Code)</span>
        <div class="search-row">
            <div class="search-group">
                <label><i class="fas fa-location-dot" style="color:#e63946; margin-right:4px;"></i> From</label>
                <input type="text" id="sourceInput" placeholder="e.g. Delhi, NDLS, Mumbai" value="Delhi" autofocus>
            </div>
            <div class="search-group">
                <label><i class="fas fa-flag-checkered" style="color:#00e676; margin-right:4px;"></i> To</label>
                <input type="text" id="destInput" placeholder="e.g. Mumbai, BCT, Chennai" value="Mumbai">
            </div>
            <div class="search-group">
                <label><i class="fas fa-calendar-day"></i> Date</label>
                <input type="date" id="dateInput">
            </div>
            <div class="search-group" style="flex: 0 1 auto;">
                <button class="btn-search" onclick="searchTrains()"><i class="fas fa-arrow-right"></i> Search</button>
            </div>
        </div>
        <div class="quick-routes">
            <span>Quick Routes:</span>
            <button class="quick-btn" onclick="quickSearch('Delhi','Mumbai')">Delhi → Mumbai</button>
            <button class="quick-btn" onclick="quickSearch('Mumbai','Delhi')">Mumbai → Delhi</button>
            <button class="quick-btn" onclick="quickSearch('Kolkata','Delhi')">Kolkata → Delhi</button>
            <button class="quick-btn" onclick="quickSearch('Bangalore','Mumbai')">Bangalore → Mumbai</button>
            <button class="quick-btn" onclick="quickSearch('Chennai','Delhi')">Chennai → Delhi</button>
            <button class="quick-btn" onclick="quickSearch('Delhi','Guwahati')">Delhi → Guwahati</button>
        </div>
    </div>

    <div class="search-card" id="trainNumberSearch">
        <span class="search-title"><i class="fas fa-hashtag"></i> Search Train by Number</span>
        <div class="search-row">
            <div class="search-group">
                <label><i class="fas fa-train"></i> Train Number</label>
                <input type="text" id="trainNumberInput" placeholder="e.g. 12951, 12002, 12259">
            </div>
            <div class="search-group" style="flex: 0 1 auto;">
                <button class="btn-search" onclick="searchByNumber()"><i class="fas fa-search"></i> Find Train</button>
            </div>
        </div>
        <div class="quick-routes">
            <span>Popular Trains:</span>
            <button class="quick-btn" onclick="quickTrainSearch('12951')">12951 Rajdhani</button>
            <button class="quick-btn" onclick="quickTrainSearch('12002')">12002 Shatabdi</button>
            <button class="quick-btn" onclick="quickTrainSearch('12259')">12259 Duronto</button>
            <button class="quick-btn" onclick="quickTrainSearch('12625')">12625 Kerala Express</button>
        </div>
    </div>

    <!-- LIVE FEED -->
    <section class="live-feed" id="liveFeed">
        <h3><i class="fas fa-bolt"></i> Live Trains</h3>
        <div class="live-grid" id="liveGrid"></div>
    </section>

    <!-- SPINNER -->
    <div class="spinner" id="loadingSpinner">
        <i class="fas fa-circle-notch"></i>
        <p id="loadingText">Searching for trains...</p>
    </div>

    <!-- RESULTS -->
    <div class="results-card" id="resultsCard">
        <div class="results-header">
            <h2 class="gradient-text">Search Results <small id="routeDisplay">Delhi → Mumbai</small></h2>
            <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
                <span class="results-count" id="resultsCount">0 trains found</span>
                <button class="refresh-toggle" id="refreshToggle" onclick="toggleAutoRefresh()">
                    <span class="pulse-dot"></span> Auto-Refresh Off
                </button>
            </div>
        </div>
        <div id="backButtonContainer" style="margin-bottom:18px; display:none;">
            <button class="btn-back" onclick="clearResults()"><i class="fas fa-arrow-left"></i> Back to Search</button>
        </div>
        <div class="train-list" id="trainList"></div>
    </div>

    <!-- DETAIL VIEW -->
    <div id="detailView">
        <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; align-items:center;">
            <button class="btn-back" onclick="showResults()"><i class="fas fa-arrow-left"></i> Back to Results</button>
            <button class="pdf-btn" onclick="exportPDF()"><i class="fas fa-file-pdf"></i> Export PDF</button>
        </div>
        <div class="detail-card" id="detailCard"></div>
    </div>

    <!-- ERROR -->
    <div id="errorDisplay"></div>

</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- html2canvas + jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
    // ============================================================
    // API BASE URL (FIXED)
    // ============================================================
    const API_BASE = 'http://127.0.0.1:5001';
    console.log('🔗 API_BASE:', API_BASE);

    // ============================================================
    // HELPER: Format minutes to "Xh Ym"
    // ============================================================
    function formatDuration(minutes) {
        const mins = Math.round(minutes);
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        if (h > 0) {
            return `${h}h ${m}m`;
        } else {
            return `0h ${m}m`;
        }
    }

    // ============================================================
    // GLOBAL STATE
    // ============================================================
    let isAdminMode = true;
    let currentResults = [];
    let currentDetailData = null;
    let mapInstance = null;
    let mapMarker = null;
    let mapAnimationId = null;
    let autoRefreshInterval = null;
    let currentSource = 'Delhi';
    let currentDestination = 'Mumbai';
    let currentDate = null;

    // ============================================================
    // DATE/TIME
    // ============================================================
    function updateDateTime() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
        document.getElementById('currentDateTime').textContent = now.toLocaleDateString('en-US', options);
    }
    updateDateTime();

    // ============================================================
    // MODE TOGGLE
    // ============================================================
    function toggleMode() {
        isAdminMode = !isAdminMode;
        const btn = document.getElementById('modeToggle');
        const body = document.body;
        if (isAdminMode) {
            body.classList.add('admin-mode');
            btn.innerHTML = '<i class="fas fa-user-shield"></i> Admin Mode';
            btn.classList.add('active');
        } else {
            body.classList.remove('admin-mode');
            btn.innerHTML = '<i class="fas fa-user"></i> Passenger Mode';
            btn.classList.remove('active');
        }
        if (currentDetailData) {
            renderDetail(currentDetailData);
        }
    }
    document.body.classList.add('admin-mode');

    // ============================================================
    // AUTO-REFRESH
    // ============================================================
    function toggleAutoRefresh() {
        const btn = document.getElementById('refreshToggle');
        if (autoRefreshInterval) {
            clearInterval(autoRefreshInterval);
            autoRefreshInterval = null;
            btn.classList.remove('active');
            btn.innerHTML = '<span class="pulse-dot"></span> Auto-Refresh Off';
        } else {
            btn.classList.add('active');
            btn.innerHTML = '<span class="pulse-dot"></span> Auto-Refresh On (30s)';
            if (currentSource && currentDestination) {
                searchTrains(true);
            }
            autoRefreshInterval = setInterval(() => {
                if (currentSource && currentDestination) {
                    searchTrains(true);
                }
            }, 30000);
        }
    }

    // ============================================================
    // LOAD HOME DATA
    // ============================================================
    async function loadHomeData() {
        try {
            const response = await fetch(API_BASE + '/search_trains', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ source: 'Delhi', destination: 'Mumbai', date: new Date().toISOString().split('T')[0] })
            });
            const data = await response.json();
            if (data.status === 'success' && data.trains && data.trains.length > 0) {
                const trains = data.trains;
                const total = trains.length;
                const delayed = trains.filter(t => t.delay > 10).length;
                const onTime = trains.filter(t => t.delay <= 10).length;
                const avgDelay = total > 0 ? Math.round(trains.reduce((sum, t) => sum + t.delay, 0) / total) : 0;
                document.getElementById('statsContainer').innerHTML = `
                    <div class="stat-item"><span class="number">${total}</span><span class="label">Trains on Route</span></div>
                    <div class="stat-item"><span class="number red">${delayed}</span><span class="label">Delayed</span></div>
                    <div class="stat-item"><span class="number green">${onTime}</span><span class="label">On Time</span></div>
                    <div class="stat-item"><span class="number orange">${avgDelay}m</span><span class="label">Avg Delay</span></div>
                `;
                const grid = document.getElementById('liveGrid');
                grid.innerHTML = '';
                trains.slice(0, 4).forEach(train => {
                    const delayClass = train.delay > 10 ? 'delayed' : 'on-time';
                    const delayText = train.delay > 0 ? `${train.delay}m` : 'On Time';
                    const card = document.createElement('div');
                    card.className = 'live-card';
                    card.innerHTML = `
                        <div class="train-num">${train.number}</div>
                        <div class="train-name">${train.name}</div>
                        <div class="status">
                            <span>${train.current_location_name}</span>
                            <span class="delay-badge ${delayClass}">${delayText}</span>
                        </div>
                        <div class="route-mini"><i class="fas fa-arrow-right"></i> ${train.destination_name}</div>
                    `;
                    card.onclick = () => showDetail(train.number, train.source, train.destination);
                    grid.appendChild(card);
                });
            } else {
                document.getElementById('statsContainer').innerHTML = `
                    <div class="stat-item"><span class="number">--</span><span class="label">Trains on Route</span></div>
                    <div class="stat-item"><span class="number red">--</span><span class="label">Delayed</span></div>
                    <div class="stat-item"><span class="number green">--</span><span class="label">On Time</span></div>
                    <div class="stat-item"><span class="number orange">--</span><span class="label">Avg Delay</span></div>
                `;
                document.getElementById('liveGrid').innerHTML = `<p style="color:#7e94b9;">No live train data available</p>`;
            }
        } catch (e) {
            console.warn('Home data fetch failed:', e);
        }
    }
    window.addEventListener('DOMContentLoaded', loadHomeData);
    document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];

    // ============================================================
    // TAB SWITCHING
    // ============================================================
    function switchTab(tab) {
        document.getElementById('tabRoute').classList.toggle('active', tab === 'route');
        document.getElementById('tabTrain').classList.toggle('active', tab === 'train');
        document.getElementById('routeSearch').classList.toggle('active', tab === 'route');
        document.getElementById('trainNumberSearch').classList.toggle('active', tab === 'train');
        clearResults();
    }

    // ============================================================
    // QUICK HELPERS
    // ============================================================
    function quickSearch(source, dest) {
        document.getElementById('sourceInput').value = source;
        document.getElementById('destInput').value = dest;
        switchTab('route');
        searchTrains();
    }
    function quickTrainSearch(num) {

        const destination = document.getElementById('destInput').value.trim();
        const date = document.getElementById('dateInput').value;
        
        if (!source || !destination) { 
            if (!silent) showError('Please enter source and destination.'); 
            return; 
        }
        
        currentSource = source;
        currentDestination = destination;
        currentDate = date;

        if (!silent) showLoading('Searching for trains...');
        
        try {
            const resp = await fetch(API_BASE + '/search_trains', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ source, destination, date })
            });
            const result = await resp.json();
            if (!silent) hideLoading();
            
            if (result.status === "success") {
                currentResults = result.trains || [];
                document.getElementById('routeDisplay').textContent = `${result.source_name || source} → ${result.destination_name || destination}`;
                document.getElementById('resultsCount').textContent = `${result.count || 0} trains found`;

                        const delayText = train.delay > 0 ? `${train.delay}m` : 'On Time';
                        const div = document.createElement('div');

                                    <i class="fas fa-flag-checkered" style="color:#00e676;"></i> ${train.destination_name}

        document.getElementById('resultsCard').classList.remove('visible');

                headers: { 'Content-Type': 'application/json' },

    // ============================================================
    // LEAFET MAP WITH ANIMATION (unchanged)
    // ============================================================
    let routeCoordinates = [];
    let routeStations = [];
    let currentIndex = 0;
    let marker = null;
    let polyline = null;

    function initMapWithAnimation(train) {
        const container = document.getElementById('routeMapContainer');
        if (!container) return;
        if (mapInstance) {
            mapInstance.remove();
            mapInstance = null;
        }
        const stations = train.full_route || [];
        if (stations.length < 2) {
            container.innerHTML = '<div style="color:#7e94b9;padding:20px;text-align:center;">Route map unavailable</div>';
            return;
        }

        const baseLat = 20.5937, baseLng = 78.9629;
        const coords = stations.map((s, idx) => {
            const spread = (idx / (stations.length - 1)) * 10 - 5;
            return [baseLat + spread * 1.2 + (Math.random() - 0.5) * 0.3, baseLng + spread * 1.5 + (Math.random() - 0.5) * 0.3];
        });

        let currentIdx = stations.findIndex(s => s.is_current);
        if (currentIdx === -1) currentIdx = 0;
        
        routeCoordinates = coords;
        routeStations = stations;
        currentIndex = currentIdx;

        mapInstance = L.map(container).setView(coords[currentIdx] || coords[0], 5);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(mapInstance);

        polyline = L.polyline(coords, { color: '#e63946', weight: 4, opacity: 0.6 }).addTo(mapInstance);

        coords.forEach((pos, idx) => {
            const station = stations[idx] || { code: 'STA', name: 'Station' };
            const isCurrent = idx === currentIdx;
            L.circleMarker(pos, {
                radius: isCurrent ? 8 : 5,
                fillColor: isCurrent ? '#ffc107' : '#4fc3f7',
                color: isCurrent ? '#ffffff' : '#4fc3f7',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.8
            }).addTo(mapInstance).bindPopup(`<b>${station.code}</b><br>${station.name}${isCurrent ? ' (Current)' : ''}`);
        });

        marker = L.circleMarker(coords[currentIdx], {
            radius: 10,
            fillColor: '#e63946',
            color: '#ffffff',
            weight: 3,
            opacity: 1,
            fillOpacity: 0.9
        }).addTo(mapInstance);
        marker.bindPopup(`<b>${train.train_name}</b><br>Current: ${train.current_location_name}`);

        mapInstance.fitBounds(polyline.getBounds(), { padding: [30, 30] });

        if (currentIdx < coords.length - 1) {
            animateTrain(coords, currentIdx);
        }
    }

    function animateTrain(coords, startIdx) {
        if (mapAnimationId) {
            cancelAnimationFrame(mapAnimationId);
        }
        
        let currentPos = startIdx;
        let progress = 0;
        const duration = 5000;
        
        function step(timestamp) {
            if (!marker || !mapInstance) return;
            
            if (currentPos >= coords.length - 1) {
                return;
            }
            
            const start = coords[currentPos];
            const end = coords[currentPos + 1];
            const speed = 1 / (duration / 16);
            
            progress += speed;
            
            if (progress >= 1) {
                progress = 0;
                currentPos++;
                if (currentPos >= coords.length - 1) {
                    marker.setLatLng(end);
                    return;
                }
            }
            
            const lat = start[0] + (end[0] - start[0]) * Math.min(progress, 1);
            const lng = start[1] + (end[1] - start[1]) * Math.min(progress, 1);
            marker.setLatLng([lat, lng]);
            
            mapAnimationId = requestAnimationFrame(step);
        }
        
        mapAnimationId = requestAnimationFrame(step);
    }

    // ============================================================
    // EXPORT PDF (unchanged)
    // ============================================================
    function exportPDF() {
        const element = document.getElementById('pdfContent');
        if (!element) {
            alert('No data to export. Please view a train first.');
            return;
        }

        const btn = document.querySelector('.pdf-btn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating PDF...';
        btn.disabled = true;

        html2canvas(element, {
            scale: 2,
            backgroundColor: '#080c18',
            allowTaint: true,
            useCORS: true,
            logging: false,
            height: element.scrollHeight,
            windowHeight: element.scrollHeight
        }).then(canvas => {
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const imgWidth = 210;
            const imgHeight = (canvas.height * imgWidth) / canvas.width;
            
            let heightLeft = imgHeight;
            let position = 0;
            
            pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
            heightLeft -= pdf.internal.pageSize.height;
            
            while (heightLeft > 0) {
                position = heightLeft - imgHeight;
                pdf.addPage();
                pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                heightLeft -= pdf.internal.pageSize.height;
            }
            
            pdf.save(`Train_${currentDetailData?.train_number || 'Report'}_ETA_Report.pdf`);
            
            btn.innerHTML = originalText;
            btn.disabled = false;
        }).catch(err => {
            console.error('PDF generation failed:', err);
            alert('Failed to generate PDF. Please try again.');
            btn.innerHTML = originalText;
            btn.disabled = false;
        });
    }

    // ============================================================
    // EXPORT CSV
    // ============================================================
    function exportCSV(trainNumber) {
        const train = currentDetailData;
        if (!train || !train.station_etas) {
            alert('No data to export');
            return;
        }
        let csv = 'Station Code,Station Name,Scheduled,Predicted,Delay (mins),Average Delay (mins)\n';
        train.station_etas.forEach(s => {
            const avg = s.average_delay || 0;
            csv += `${s.station_code},${s.station_name},${s.scheduled_time},${s.predicted_time},${s.delay_mins},${avg}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Train_${trainNumber}_Report.csv`;
        a.click();
        URL.revokeObjectURL(url);
    }

        document.getElementById('resultsCard').classList.remove('visible');
        document.getElementById('detailView').classList.remove('visible');
        document.getElementById('detailView').style.display = 'none';
        document.getElementById('errorDisplay').style.display = 'none';
        document.getElementById('sourceInput').focus();
        
        if (autoRefreshInterval) {
            clearInterval(autoRefreshInterval);
            autoRefreshInterval = null;
            const btn = document.getElementById('refreshToggle');
            btn.classList.remove('active');
            btn.innerHTML = '<span class="pulse-dot"></span> Auto-Refresh Off';
        }
    }

    // Enter key support
    document.getElementById('sourceInput').addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('destInput').focus(); });
    document.getElementById('destInput').addEventListener('keypress', e => { if (e.key === 'Enter') searchTrains(); });
    document.getElementById('trainNumberInput').addEventListener('keypress', e => { if (e.key === 'Enter') searchByNumber(); });
</script>
</body>
</html>
